name: Validate profile

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install profile with the supported installer
        run: |
          bash -n scripts/install.sh
          HOME="$RUNNER_TEMP/gemini-home" bash scripts/install.sh --skip-update

      - name: Verify installed profile and hook behavior
        run: |
          HOME="$RUNNER_TEMP/gemini-home" python3 "$RUNNER_TEMP/gemini-home/.gemini/config/agy-focus/current/scripts/verify_profile.py"
          HOME="$RUNNER_TEMP/gemini-home" python3 "$RUNNER_TEMP/gemini-home/.gemini/config/agy-focus/current/scripts/test_hook_runner.py"
